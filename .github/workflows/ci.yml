name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Reconstruir local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}" >> local.properties

      - name: Reconstruir google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Compilar proyecto
        run: ./gradlew assembleDebug

      - name: Ejecutar pruebas unitarias
        run: ./gradlew test

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
