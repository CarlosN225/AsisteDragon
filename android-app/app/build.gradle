
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'  // ← AGREGAR

}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
android {
    namespace 'com.utfv.asistedragon'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.utfv.asistedragon"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "MISTRAL_API_KEY", "\"${localProperties.getProperty('MISTRAL_API_KEY', '')}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Activity
    implementation 'androidx.activity:activity:1.9.2'

    // Firebase BoM (Bill of Materials)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')

    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'

    // Firestore
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase Storage (para PDFs después)
    implementation 'com.google.firebase:firebase-storage'

    // ML Kit para escaneo de códigos de barras/QR
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // CameraX para la cámara
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    //API KEY GEMINI
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ML Kit para OCR (Text Recognition)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Procesamiento de imágenes
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
    // OkHttp para llamadas HTTP
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    //Reload
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Foto circular
    implementation 'de.hdodenhof:circleimageview:3.1.0'
// Carga de imágenes
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// FORZAR versiones específicas
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.activity:activity:1.9.2'
        force 'androidx.lifecycle:lifecycle-runtime:2.8.6'
    }
}